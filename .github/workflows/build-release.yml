name: Build & Release DeviceShield APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag phiên bản (vd: v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_title:
        description: 'Tiêu đề Release'
        required: false
        default: 'DeviceShield v1.0.0 - Threat Detection & Integrity Checker'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Tạo Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Phân quyền thực thi cho gradlew
        run: chmod +x gradlew

      - name: Biên dịch APK với Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Chuẩn bị file phát hành (Artifacts & Checksum)
        id: prepare_files
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "master" ]; then
            TAG="v1.0.0"
          fi
          echo "TAG_NAME=$TAG" >> $GITHUB_ENV
          
          # Tìm file APK đầu ra
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          fi
          
          APK_DEST="DeviceShield-${TAG}.apk"
          cp "$APK_SRC" "./${APK_DEST}"
          sha256sum "${APK_DEST}" > "${APK_DEST}.sha256"
          
          echo "File APK xuất xưởng: ${APK_DEST}"
          cat "${APK_DEST}.sha256"

      - name: Tạo GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ github.event.inputs.release_title || env.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            DeviceShield-*.apk
            DeviceShield-*.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
